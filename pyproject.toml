[project]
name = "ragebaitLM"
version = "0.1.0"
description = "Analyse coding agent sessions for user mood (joy ↔ rage)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "pandas>=2.2",
    "plotly>=5.24",
    "numpy>=1.26",
    "vaderSentiment>=3.3.2",
]

[project.optional-dependencies]
# The transformer sentiment engine. Large (pulls torch + model weights).
ml = [
    "torch>=2.2",
    "transformers>=4.44",
]
dev = [
    "pytest>=8.2",
]

[project.scripts]
ragebaitlm = "ragebaitlm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragebaitlm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
